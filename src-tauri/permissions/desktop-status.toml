[[permission]]
identifier = "desktop-status"
description = "允许主窗口读取 HDX Desktop 状态，并通过 Rust BFF 调用 HDX API。"
commands.allow = [
    "desktop_status",
    "capability_status",
    "hdx_auth_session",
    "hdx_auth_login",
    "hdx_auth_logout",
    "hdx_online_config_get",
    "hdx_online_config_save",
    "hdx_online_connection_check",
    "hdx_runtime_info",
    "hdx_tools_list",
    "hdx_tools_create",
    "hdx_workbench_layout_get",
    "hdx_workbench_layout_save",
    "hdx_timer_preferences_get",
    "hdx_timer_preferences_save",
]
