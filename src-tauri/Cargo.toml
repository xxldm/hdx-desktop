[package]
name = "hdx-desktop"
version = "0.1.0"
description = "HDX Desktop"
authors = ["HDX"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hdx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2"

[features]
default = []
flavor-full = []
flavor-online = []
